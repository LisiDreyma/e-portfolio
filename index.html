<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisifianna Dreyma</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/31fba75b8e.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Lisifianna Dreyma</div>
        <ul class="nav__link--list">
          <li>
            <a href="" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
            ">Languages</a>
          </li>
          <li>
            <a href="" class="
            nav__link--anchor
            link__hover-effect
            link__hover-effect--black
            ">Projects</a>
          </li>
          <li>
            <a href="" class="
            nav__link--anchor
            nav__link--anchor-primary
            ">Contact</a>
          </li>
        </ul>
      </nav>
      <div class="flex flex-1">
        <div class="about-me__info row">
          <div class="about-me__info--container">
            <figure class="about-me__picture--mask">
              <img src="./myself.jpg" class="about-me__picture" alt="picture self representation">
            </figure>
            <h1 class="about-me__info--title">
              Hello! I'm <span class="text--purple">Lisfianna Dreyma</span> 👋
            </h1>
            <p class="about-me__info--para">I'm a <strong class="text--purple">frontend simplified student</strong> currently, really excited to be starting a new chapter. I have a passion for creative outlets, and love seeing it all come together in web design.
            </p>
            <div class="about-me__links">
              <a href="" class="about-me__link">
                <i class="fa-brands fa-linkedin"></i>
                <i class="fa-brands fa-github"></i>
                <i class="fa-solid fa-envelope"></i>
                <i class="fa-solid fa-file"></i>
              </a>
            </div>
          </div>
          <figure class="about-me__image--container">
            <img src="./assets/undraw_websites.svg" alt="">
          </figure>
        </div>
      </div>
    </section>
  </body>
</html>
